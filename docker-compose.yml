version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: mental_health_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
      - MONGO_INITDB_DATABASE=mental_health
    networks:
      - mental_health_network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Backend Service
  backend:
    build:
      context: ./flask_backend
      dockerfile: Dockerfile
    container_name: mental_health_backend
    ports:
      - "5000:5000"
    volumes:
      # Mount source code for hot reload
      - ./flask_backend:/app
      # Exclude virtual environment
      - /app/.venv
      - /app/__pycache__
    env_file:
      - ./flask_backend/.env
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - PYTHONUNBUFFERED=1
      - MONGO_URL=mongodb://admin:admin123@mongodb:27017/mental_health?authSource=admin
    networks:
      - mental_health_network
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    command: python -m flask run --host=0.0.0.0 --port=5000 --reload

  # React Frontend Service
  frontend:
    build:
      context: ./chat_botX
      dockerfile: Dockerfile
    container_name: mental_health_frontend
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for hot reload
      - ./chat_botX:/app
      # Exclude node_modules for better performance
      - /app/node_modules
    env_file:
      - ./chat_botX/.env.docker
    environment:
      - NODE_ENV=development
      - VITE_BACKEND_URL=http://backend:5000
    networks:
      - mental_health_network
    depends_on:
      - backend
    restart: unless-stopped
    stdin_open: true
    tty: true

networks:
  mental_health_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  backend_data:
  frontend_data:
